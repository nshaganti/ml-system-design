name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Install CPU-only torch FIRST from the PyTorch CPU wheel index. The
        # default Linux torch wheel drags in ~5GB of NVIDIA CUDA libraries we
        # don't need for CPU tests -- that filled the runner disk (Errno 28).
        # --no-cache-dir keeps pip from doubling disk usage with a wheel cache.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        # The suite uses only small synthetic data -- no dataset download needed.
        run: pytest tests/ -q

      - name: Check scoreboard is in sync with results.json
        # Fails if docs/results.md tables drifted from the committed phase
        # results.json -- i.e. someone edited numbers by hand instead of via
        # scripts/build_results.py. Uses committed JSON, so no dataset needed.
        run: python scripts/build_results.py --check
